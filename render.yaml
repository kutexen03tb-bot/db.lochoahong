services:
  - type: web
    name: linkscope-private  # Keep existing Blueprint service name; website login is removed.
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --config gunicorn.conf.py deploy_app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
